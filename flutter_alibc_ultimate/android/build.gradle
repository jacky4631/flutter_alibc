group 'com.wxwx.flutter_alibc_ultimate'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.7.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.4.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        repositories {
            flatDir {
                dirs 'libs', 'aars'
            }
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.wxwx.flutter_alibc_ultimate"

    compileSdkVersion 31
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions { jvmTarget = 1.8 }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 16
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.alibaba:fastjson:1.1.71.android'

    // TODO: 将旗舰版SDK的aar/jar文件放入 libs/ 目录，并在此添加依赖
    // 以下为示例，请根据实际旗舰版SDK文件名调整
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // implementation(name: 'AlibcTradeBiz-旗舰版版本号', ext: 'aar')
    // implementation(name: 'AlibcTradeCommon-旗舰版版本号', ext: 'aar')
    // implementation(name: 'nb_trade-旗舰版版本号', ext: 'aar')
    // implementation(name: 'alibabauth_core-旗舰版版本号', ext: 'aar')
    // implementation(name: 'alibabauth_ext-旗舰版版本号', ext: 'aar')
    // implementation(name: 'alibabauth_ui-旗舰版版本号', ext: 'aar')
    // implementation(name: 'alibc_link_partner-旗舰版版本号', ext: 'aar')
    // implementation(name: 'securityguardaar3-旗舰版版本号', ext: 'aar')
    // implementation(name: 'securitybodyaar3-旗舰版版本号', ext: 'aar')
    // implementation(name: 'sgmiddletieraar3-旗舰版版本号', ext: 'aar')
    // implementation(name: 'miscaar3-旗舰版版本号', ext: 'aar')
