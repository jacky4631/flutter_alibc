name: flutter_alibc_ultimate
description: Flutter版本的阿里百川旗舰版，支持Android、iOS和鸿蒙
version: 1.0.0
homepage: https://github.com/flutterbest/flutter_alibc_kit.git

environment:
  sdk: '>=2.12.0 <4.0.0'
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.15.0-nullsafety.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.wxwx.flutter_alibc_ultimate
        pluginClass: FlutterAlibcUltimatePlugin
      ios:
        pluginClass: FlutterAlibcUltimatePlugin
      harmony:
        pluginClass: FlutterAlibcUltimatePlugin
