apply plugin: 'com.android.application'


android {
    compileSdkVersion 28
    buildToolsVersion "28.0.3"
    defaultConfig {
        applicationId "com.example.ultimate_demo"
        minSdkVersion 16
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        debug {
            storeFile file('../keystore')
            storePassword '123456'
            keyAlias 'keystore'
            keyPassword '123456'
        }
        release {
            storeFile file('../keystore')
            storePassword '123456'
            keyAlias 'keystore'
            keyPassword '123456'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

    }


    android {
        lintOptions {
            abortOnError false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}


repositories {
    flatDir {
        dirs 'libs', '../libs'
    }
}

dependencies {
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'

    // 登陆
    implementation(name: 'alibclogin-5.0.2.5', ext: 'aar')
    // applink
    implementation(name: 'alibcapplink-5.0.2.5', ext: 'aar')
    // 广告SDK
    implementation(name: 'alibcad-5.0.2.5', ext: 'aar')

    // 小程序
    implementation(name: 'alibctriver-5.0.2.5', ext: 'aar')
    // c++基础库（如果工程中没有接入该so包：libc++_shared.so，需要接入该sdk）
    implementation(name: 'cpp_shared-0.0.3', ext: 'aar')

    // 直播
    implementation(name: 'alibctriver_live-5.0.2.5', ext: 'aar')
    // 直播业务需要cardview
    implementation "com.android.support:cardview-v7:28.0.0"

    // webview容器
    implementation(name: 'alibcwebview-5.0.2.5', ext: 'aar')

    // 电商基础组件
    implementation(name: 'alibctradecommon-5.0.2.5', ext: 'aar')
    implementation(name: 'alibcnbtrade-5.0.2.5', ext: 'aar')
    implementation(name: 'alibcprotocol-5.0.2.5', ext: 'aar')
    implementation 'com.alibaba:fastjson:1.1.71.android'

    // 该模块主要包括任务激励、TOP授权逻辑，媒体侧可根据自己业务上是否接入来决定是否需要引入该模块
    implementation(name: 'alibcextend-5.0.2.5', ext: 'aar')

    // 安全保镖v6版本
    implementation(name: 'osmss3rd-adapter-0.0.4', ext: 'aar')
    implementation(name: 'osmss3rd-android-0.0.7', ext: 'aar')
    implementation(name: 'osmss3rd-core-android-0.0.1', ext: 'aar')

    // 其他（业务按需）
    implementation('com.facebook.fresco:fresco:0.10.0') {
        exclude(module: 'support-v4')
    }
}